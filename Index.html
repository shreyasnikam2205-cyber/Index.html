<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spider-Man Movie Date? 🕷️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: radial-gradient(circle, #1a0b1e 0%, #08020a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }
    .card {
      background: rgba(20, 20, 30, 0.85);
      border: 2px solid #e50914;
      box-shadow: 0 0 25px rgba(229, 9, 20, 0.4), inset 0 0 15px rgba(0, 162, 255, 0.2);
      border-radius: 20px;
      padding: 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      position: relative;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }
    .badge {
      background: #e50914;
      color: #fff;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      border-radius: 50px;
      text-transform: uppercase;
      align-self: center;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
    }
    h1 {
      font-size: 26px;
      color: #ffffff;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
    }
    .movie-title {
      color: #00d2ff;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 15px;
    }
    .date-badge {
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-container {
      position: relative;
      height: 120px;
      width: 100%;
      margin-top: 10px;
    }
    .btn {
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-yes {
      background: linear-gradient(135deg, #e50914, #99000d);
      color: white;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.5);
      position: absolute;
      left: 15%;
      top: 30px;
    }
    .btn-yes:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(229, 9, 20, 0.8);
    }
    .btn-no {
      background: #333;
      color: #ccc;
      position: absolute;
      right: 15%;
      top: 30px;
      transition: top 0.15s ease, left 0.15s ease;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-content {
      background: #12121c;
      border: 2px solid #00d2ff;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 380px;
    }
    .modal-content h2 {
      color: #00d2ff;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div>
      <div class="badge">🕷️ Special Invitation</div>
      <h1>Movie Date?</h1>
      <div class="movie-title">Spider-Man: Brand New Day</div>
      <div class="date-badge">📅 <strong>August 2, 2026</strong></div>
      <p style="color: #aaa; font-size: 14px;">My spider-sense tells me you can't say no to this... 😉</p>
    </div>

    <div class="btn-container" id="area">
      <button class="btn btn-yes" onclick="acceptInvitation()">YES! 🍿</button>
      <button class="btn btn-no" id="noBtn" onmouseover="dodge()" onclick="dodge()">No</button>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>Woohoo! It's a Date! 🕸️❤️</h2>
      <p style="margin-bottom: 15px; font-size: 16px;">I knew you'd make the right choice!</p>
      <p style="color: #aaa;">See you on <strong>August 2nd</strong> for <em>Spider-Man: Brand New Day</em>. Popcorn is on me!</p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const area = document.getElementById('area');

    function dodge() {
      const areaRect = area.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = areaRect.width - btnRect.width;
      const maxY = areaRect.height - btnRect.height;

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }

    // Touch support for phones
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      dodge();
    });

    function acceptInvitation() {
      document.getElementById('modal').style.display = 'flex';
    }
  </script>
</body>
</html>
